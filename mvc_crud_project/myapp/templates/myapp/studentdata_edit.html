<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Form</title>
    {% load static %}
    <link href="{% static 'myapp/css/style.css' %}" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
  </head>
  <body>
    <div class="form_box">
      <form action="{% url 'studentdata_edit' %}" method="post">
        {% csrf_token %}
        <h2 class="text-center">Update Data</h2>

        {% if msg %}
        <h6
          class="text-center alert {% if msg_type == 'error' %}alert-danger text-dark{% else %}alert-success text-dark{% endif %}"
        >
          {{ msg }}
        </h6>
        {% endif %}

        <div class="mb-3">
          <label for="sid">SID</label>
          <input
            type="number"
            id="sid"
            name="sid"
            value="{{data.sid}}"
            readonly
          />
        </div>

        <div class="mb-3">
          <label for="sname">Name</label>
          <input
            type="text"
            id="sname"
            name="sname"
            value="{{data.sname}}"
          />
        </div>

        <div class="mb-3">
          <label for="slocation">Location</label>
          <input
            type="text"
            id="slocation"
            name="slocation"
            value="{{data.slocation}}"
          />
        </div>

        <div class="mb-3">
          <label for="semail">Email</label>
          <input
            type="text"
            id="semail"
            name="semail"
            value="{{data.semail}}"
          />
        </div>

        <div class="mb-3">
          <label for="sage">Age</label>
          <input
            type="number"
            id="sage"
            name="sage"
            value="{{data.sage}}"
          />
        </div>

        <div class="btn-group">
          <input type="submit" value="Update" name="btn" />
          <input type="reset" value="Reset" name="btn" />
        </div>
      </form>
    </div>
  </body>
</html>
